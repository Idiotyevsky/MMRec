name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          # the aggregation guards check declared code-equivalence classes by
          # resolving real commits; a depth-1 clone has none of them
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: install (CPU-only)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: unit tests
        run: pytest -q

      - name: README tables match results/tables
        # the README is generated; a hand-edited number fails here
        run: python analysis/update_readme.py --check

      - name: README assets, links and anchors resolve
        run: python analysis/check_readme_assets.py

      - name: README vector assets are up to date
        # the cold-start figure is generated from results/tables/cold_start.csv;
        # a stale committed SVG fails here
        run: |
          python analysis/generate_readme_visuals.py
          git diff --exit-code -- assets/icons assets/system_architecture.svg assets/cold_start_summary.svg

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build
