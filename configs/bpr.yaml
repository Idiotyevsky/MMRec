model:
  name: bpr
  hidden_size: 128
  dropout: 0.0
  zero_cold_id: true

data:
  processed_dir: data/processed/base
  feature_dir: data/raw
  max_sequence_length: 50

loss:
  num_negatives: 1
  temperature: 1.0

negative_sampling:
  mode: uniform

training:
  batch_size: 2048
  learning_rate: 0.001
  weight_decay: 0.0001
  max_grad_norm: 5.0
  amp: true
  epochs: 300
  early_stopping_patience: 30
  scheduler: none
  monitor: NDCG@10
  monitor_mode: max
  seed: 42
  num_workers: 0

evaluation:
  full_ranking: true
  item_chunk_size: 4096
  ks: [5, 10, 20]
